[project]
name = "mobile-mcp"
version = "0.2.0"
description = "MCP server for direct iOS Simulator and Android Emulator control. Pluggable backends: native (xcrun simctl + adb) and Appium. Drop-in replacement for MobAI MCP."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "openai>=1.50.0",
    "pyyaml>=6.0",
    "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'",
]

[project.optional-dependencies]
appium = ["Appium-Python-Client>=5.0"]
local = []

[project.scripts]
mobile-mcp = "mobile_mcp.server:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mobile_mcp"]
